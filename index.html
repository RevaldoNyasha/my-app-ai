<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ResearchMind AI — an AI-powered qualitative research assistant for analysing interviews, discovering themes and finding evidence."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <title>ResearchMind AI — Qualitative Research Assistant</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('researchmind.theme')
          var prefersDark =
            stored !== 'light' &&
            (stored !== 'system' || window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (prefersDark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch (error) {
          /* ignore — theme falls back to light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
